<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#022c22" />
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981" />
      <stop offset="100%" stop-color="#059669" />
    </linearGradient>
    <linearGradient id="shieldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#2563eb" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  
  <!-- Rounded App Background -->
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)" />
  
  <!-- Decorative Ring -->
  <circle cx="256" cy="256" r="190" fill="none" stroke="#10b981" stroke-width="6" stroke-opacity="0.25" stroke-dasharray="16 12" />

  <!-- Shopping Cart Body -->
  <g transform="translate(60, 60)" filter="url(#glow)">
    <path d="M40 70 h50 l45 190 h180 l35 -130 H120" 
          fill="none" 
          stroke="url(#accentGrad)" 
          stroke-width="26" 
          stroke-linecap="round" 
          stroke-linejoin="round" />
    
    <!-- Cart Wheels -->
    <circle cx="160" cy="330" r="26" fill="#10b981" />
    <circle cx="280" cy="330" r="26" fill="#10b981" />
    
    <!-- Shield / Safety Cap Symbol Inside Cart -->
    <path d="M220 110 L270 90 L320 110 V170 C320 215 270 240 270 240 C270 240 220 215 220 170 Z" 
          fill="url(#shieldGrad)" />
    
    <!-- Rupiah / Checkmark inside Shield -->
    <path d="M250 165 L265 180 L295 145" 
          fill="none" 
          stroke="#ffffff" 
          stroke-width="9" 
          stroke-linecap="round" 
          stroke-linejoin="round" />
  </g>
</svg>
